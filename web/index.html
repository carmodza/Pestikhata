<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="PestiKhata: offline khata, roznamcha, stock and crop management.">
  <meta name="theme-color" content="#24794e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PestiKhata">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="icons/pestikhata.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>PestiKhata</title>
  <style>
    html,body{margin:0;padding:0;height:100%;background:#f4f7f2}
    #splash{position:fixed;inset:0;display:grid;place-content:center;text-align:center;font:700 32px system-ui;color:#24794e}
    #splash img{width:80px;margin:0 auto 18px}
    @media(prefers-color-scheme:dark){html,body{background:#101b17}#splash{color:#99d4ae}}
  </style>
</head>
<body>
  <div id="splash" aria-label="PestiKhata"><img src="icons/pestikhata.svg" alt="">PestiKhata</div>
  <script>
    window.addEventListener('flutter-first-frame',function(){document.getElementById('splash')?.remove();});
    window.addEventListener('load',function(){
      if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
