name: pestikhata
description: Offline-first khata, roznamcha and agricultural stock management for Pakistani shops.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  intl: any
  uuid: ^4.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  file_picker: ^10.3.0
  share_plus: ^12.0.0
  cross_file: ^0.3.5
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  http: ^1.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  drift_dev: ^2.35.2
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: PestiSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
